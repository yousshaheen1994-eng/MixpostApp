# nixpacks.toml — Railway deployment configuration
#
# Mirrors all extensions in Dockerfile:
# pdo_mysql, redis, opcache, sockets, mbstring + original set.
# Railway uses this when no Dockerfile is present (or delete Dockerfile to force it).

[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pcntl",
    "php82Extensions.pdo_pgsql",
    "php82Extensions.pgsql",
    "php82Extensions.pdo",
    "php82Extensions.mbstring",
    "php82Extensions.xml",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.bcmath",
    "php82Extensions.fileinfo",
    "php82Extensions.tokenizer",
    "php82Extensions.openssl",
    "php82Extensions.ctype",
    "php82Extensions.gd",
    "php82Extensions.exif",
    "php82Extensions.opcache",
    "php82Extensions.sockets",
    "php82Extensions.redis",
    "composer"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
    "php artisan mixpost:publish --no-interaction || true"
]

[start]
cmd = "php artisan migrate --force --no-interaction && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
